name: Benchmark
# The suite of benchmark/benchmarks.jl. On a pull request it also measures the base branch with the same suite and
# compares the two (report in the job summary and in a comment of the pull request); on master it reports the timings
# alone, and on demand it compares with the ref given as base (a release tag, say), or reports the timings alone without
# one. Results are kept as artifacts.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: 'Ref to compare with (e.g. a release tag); empty for the timings alone'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write # the comment with the report
jobs:
  benchmark:
    runs-on: ubuntu-latest
    # this commit and the base, each part of the suite in its own process (benchmark/run.jl)
    timeout-minutes: 120
    env:
      BENCHMARK_HEAP_SIZE_HINT: 4G
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - run: julia -e '
            import Pkg; Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/rcalxrc08/LocalRegistry.git"));
            Pkg.Registry.add("General");'
      - name: Benchmark this commit
        run: julia benchmark/run.jl head.json
      - name: Benchmark the base
        if: github.event_name == 'pull_request' || inputs.base != ''
        # the base may predate parts of the suite: the report then shows this commit alone
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
        run: |
          git worktree add ../base "$BASE_REF"
          julia benchmark/run.jl base.json ../base
      - name: Report
        run: |
          julia benchmark/compare.jl head.json base.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            head.json
            base.json
            report.md
          if-no-files-found: ignore
      - name: Comment on the pull request
        # pull requests from forks get a read-only token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md --edit-last --create-if-none
